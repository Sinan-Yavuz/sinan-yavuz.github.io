- name: SABDB
  summary: >-
    Small Area Bayesian Dynamic Borrowing, my dissertation model for estimating
    subgroup achievement in large-scale assessments like NAEP and PISA. It borrows strength across states only as
    much as the data support. Includes an interactive simulation that compares
    it with standard hierarchical models.
  type: project
  featured: true
  status: Dissertation · 2026
  tags: [Bayesian statistics, Stan, R, Small area estimation, NAEP, PISA]
  link: /projects/sabdb/
  link_label: Interactive demo
  repo: https://github.com/Sinan-Yavuz/SABDB
  paper: https://arxiv.org/abs/2608.07708

- name: miBMA
  summary: >-
    R package for multiple imputation under Bayesian model averaging. It accounts
    for uncertainty in which imputation model is right, not just in its
    parameters, and plugs into mice as method = "miBMA". Companion software to
    Kaplan & Yavuz (2020), Multivariate Behavioral Research.
  type: project
  featured: true
  status: Published · 2020
  tags: [R package, Missing data, Bayesian model averaging, mice]
  link: https://github.com/Sinan-Yavuz/miBMA
  link_label: Install from GitHub
  paper: https://doi.org/10.1080/00273171.2019.1657790

