---
layout: default
---
<article class="post">
  <header class="page-head">
    <p class="meta"><a href="{{ '/blog/' | relative_url }}">← Blog</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      · {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
