# ---------------------------------------------------------------
# Site settings: edit these first.
# ---------------------------------------------------------------
title: Sinan Yavuz
tagline: Psychometrician · Quantitative Methodologist · Pilot
description: >-
  Personal site of Sinan Yavuz: psychometrician and quantitative methodologist
  working on Bayesian methods for educational measurement. Research, projects, and writing.

# Use the address where the site is actually served (see README).
url: "https://sinan-yavuz.github.io"
baseurl: ""

author:
  name: Sinan Yavuz
  location: Seattle, WA
  # Optional: leave a field blank ("") and its link is hidden.
  email: yavuzsinan@gmail.com
  github: Sinan-Yavuz
  linkedin: yavuzsinan  # LinkedIn handle only
  orcid: 0000-0003-3131-7820
  scholar: "https://scholar.google.com/citations?user=GAx-LwQAAAAJ"
  resume: /assets/Sinan-Yavuz-CV.pdf

# ---------------------------------------------------------------
# Build settings (all supported by GitHub Pages out of the box)
# ---------------------------------------------------------------
markdown: kramdown
permalink: /blog/:year/:month/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /blog/feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
